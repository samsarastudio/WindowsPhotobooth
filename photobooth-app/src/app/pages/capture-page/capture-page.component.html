<div class="pb-page pb-kia-experience pb-capture">
  <pb-kia-shell innerClass="innerBox--capture">
    <pb-kia-logo kiaLogo />

    <div class="kia-page-body">
      <div class="kia-copy-block">
        <h1 class="main-heading main-heading--pose">{{ copy().capture.readyTitle }}</h1>
        <p class="sub-heading kia-sub-heading--tight">{{ copy().capture.readySubtitle }}</p>
      </div>

      <div class="kia-pose-stage">
        <div class="kia-pose-frame-col">
          <div class="frame w-full" [class.frame--countdown]="countdown() !== null && countdown()! > 0">
            @if (countdown() !== null && countdown()! > 0) {
              <div class="runner" aria-hidden="true"></div>
            }
            <div class="content w-full">
              <div
                class="kia-capture-preview-slot"
                [class.kia-capture-preview-slot--rotated]="cameraRotated()"
              >
              @if (useWebcam()) {
                <video
                  #videoEl
                  class="kia-capture-preview"
                  autoplay
                  playsinline
                  muted
                ></video>
              } @else if (showPreviewPlaceholder()) {
                <div class="kia-capture-preview kia-capture-preview--placeholder">
                  {{ copy().capture.starting }}
                </div>
              } @else {
                <div class="kia-capture-preview-stack">
                  <img
                    class="kia-capture-preview-layer"
                    [class.kia-capture-preview-layer--visible]="sdkPreviewActiveLayer() === 0"
                    [src]="sdkPreviewUrl0() ?? emptyPreviewSrc"
                    alt="Live preview"
                    decoding="async"
                    draggable="false"
                    (load)="onSdkPreviewLayerDecoded($event, 0)"
                  />
                  <img
                    class="kia-capture-preview-layer"
                    [class.kia-capture-preview-layer--visible]="sdkPreviewActiveLayer() === 1"
                    [src]="sdkPreviewUrl1() ?? emptyPreviewSrc"
                    alt=""
                    decoding="async"
                    draggable="false"
                    (load)="onSdkPreviewLayerDecoded($event, 1)"
                  />
                </div>
              }
              </div>
            </div>
          </div>
        </div>

        <div class="kia-pose-timer-col">
          <video
            #timerVideoEl
            class="kia-timer-video"
            src="kia/timer_video.mp4"
            muted
            playsinline
            preload="auto"
            aria-hidden="true"
          ></video>
        </div>
      </div>

      <p class="sub-heading kia-sub-heading--footer">{{ copy().capture.footerHint }}</p>
      @if (hint(); as t) {
        <p class="kia-msg">{{ t }}</p>
      }
    </div>
  </pb-kia-shell>
</div>
