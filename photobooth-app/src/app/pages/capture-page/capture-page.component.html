<div class="pb-page pb-capture">
  <div class="pb-capture-layout">
    <div
      class="pb-preview-wrap"
      [class.pb-preview-wrap--sized]="previewAspectRatio() !== null"
      [class.pb-preview-wrap--empty]="showPreviewPlaceholder()"
      [style.--preview-ar]="previewAspectRatio() ?? 1.5"
    >
      @if (useWebcam()) {
        <video
          #videoEl
          class="pb-preview"
          autoplay
          playsinline
          muted
          (loadedmetadata)="onVideoMeta($event)"
        ></video>
      } @else {
        @if (sdkPreview(); as src) {
          <img
            class="pb-preview"
            [src]="src"
            alt="Live preview"
            (load)="onPreviewImgLoad($event)"
          />
        } @else {
          <div class="pb-preview pb-preview-placeholder">{{ copy().capture.starting }}</div>
        }
      }

      @if (countdown() !== null && countdown()! > 0) {
        <div class="pb-count" aria-live="polite">{{ countdown() }}</div>
      }
    </div>

    <aside class="pb-side">
      <h2 class="pb-side-title">{{ copy().capture.sideTitle }}</h2>
      <p class="pb-instruction">{{ copy().capture.instructions }}</p>
      @if (hint(); as t) {
        <p class="pb-hint">{{ t }}</p>
      }
    </aside>
  </div>
</div>
