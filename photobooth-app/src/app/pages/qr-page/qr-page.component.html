<div class="pb-page pb-qr">
  <div class="pb-card">
    @if (branding.logoSrc(); as logo) {
      <img
        class="pb-icon pb-icon-logo"
        [src]="logo"
        [attr.alt]="copy().qr.title"
        loading="eager"
        decoding="async"
      />
    } @else {
      <span class="pb-icon" aria-hidden="true">{{ copy().qr.icon }}</span>
    }
    <h1 class="pb-title">{{ copy().qr.title }}</h1>
    <p class="pb-sub">{{ copy().qr.subtitle }}</p>

    <label class="pb-label" for="code">{{ copy().qr.codeLabel }}</label>
    <input
      id="code"
      class="pb-input"
      type="text"
      inputmode="numeric"
      autocomplete="one-time-code"
      [(ngModel)]="code"
      (keyup.enter)="onSubmit()"
    />

    @if (message(); as m) {
      <p class="pb-msg">{{ m }}</p>
    }

    <div class="pb-row">
      <button type="button" class="pb-btn pb-btn-primary" (click)="onSubmit()">{{ copy().qr.ok }}</button>
      <button type="button" class="pb-btn pb-btn-ghost" routerLink="/">{{ copy().qr.back }}</button>
    </div>

    <div class="pb-debug">
      <p class="pb-debug-label">{{ copy().qr.debugHint }}</p>
      <input
        class="pb-input pb-input-sm"
        type="text"
        placeholder="ok"
        [value]="debugInput()"
        (input)="debugInput.set($any($event.target).value)"
        (keyup.enter)="onDebugEnter()"
      />
    </div>
  </div>
</div>
