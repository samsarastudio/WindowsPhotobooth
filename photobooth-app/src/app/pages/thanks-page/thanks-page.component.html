<div class="pb-page pb-thanks">
  <div class="pb-kiosk-surface pb-thanks-inner">
    <h1 class="pb-thanks-title">{{ copy().thanks.title }}</h1>
    <p class="pb-thanks-sub">{{ copy().thanks.subtitle }}</p>
    <p class="pb-hint pb-thanks-foot">{{ copy().thanks.footnote }}</p>
    <button type="button" class="pb-btn pb-btn-primary pb-thanks-done" (click)="finish()">
      {{ copy().thanks.done }}
    </button>
  </div>
</div>
