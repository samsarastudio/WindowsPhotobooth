<div class="pb-page pb-result">
  <div class="pb-result-inner">
    <h1 class="pb-result-title">Your photo</h1>

    @if (imageDataUrl(); as src) {
      <div class="pb-result-frame">
        <img class="pb-result-img" [src]="src" alt="Captured photo" />
      </div>
    } @else {
      @if (err(); as e) {
        <p class="pb-msg">{{ e }}</p>
      } @else {
        <p class="pb-loading">Loading…</p>
      }
    }

    @if (path(); as p) {
      <p class="pb-path-hint">Saved: {{ p }}</p>
    }

    <div class="pb-row pb-result-actions">
      <button type="button" class="pb-btn pb-btn-ghost" (click)="retake()">Retake</button>
      <button type="button" class="pb-btn pb-btn-primary" (click)="submit()">Submit</button>
    </div>
  </div>
</div>
