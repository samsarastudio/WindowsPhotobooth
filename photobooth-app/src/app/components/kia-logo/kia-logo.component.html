<div class="kia-logo-wrap" [style.--kia-logo-scale]="logoScale()">
  @if (logoSrc(); as logo) {
    <img class="kia-logo" [src]="logo" alt="KIA Logo" loading="eager" decoding="async" draggable="false" />
  } @else {
    <img
      class="kia-logo"
      src="kia/logo.svg"
      alt="KIA Logo"
      loading="eager"
      decoding="async"
      draggable="false"
    />
  }
  <ng-content />
</div>
