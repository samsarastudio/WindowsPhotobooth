<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Moments Tablet — Today</title>
    <link rel="stylesheet" href="/css/tablet.css?v=20261023-retry" />
  </head>
  <body>
    <header class="tb-header">
      <div>
        <p class="tb-eyebrow">HauntBooth · Photo desk</p>
        <h1 id="tbTitle">Today’s captures</h1>
        <p id="tbSub" class="tb-sub">Loading…</p>
      </div>
      <div class="tb-header-actions">
        <label class="tb-pin">
          Operator PIN
          <input id="tbPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" />
        </label>
        <button type="button" class="tb-btn" id="tbRefresh">Refresh</button>
      </div>
    </header>

    <p id="tbStatus" class="tb-status" role="status" hidden></p>

    <p class="tb-guide">Review each photo, then send it to the booth printer. AI photos become available when processing is complete.</p>

    <main class="tb-workspace"><section id="tbPreview" class="tb-preview" aria-label="Selected photo"></section><nav class="tb-pagination" aria-label="Photo pages"><button class="tb-btn tb-ghost" id="tbPrev">Previous</button><label>Page <select id="tbPage" aria-label="Page number"></select></label><span id="tbPageMeta" role="status"></span><button class="tb-btn tb-ghost" id="tbNext">Next</button></nav><section id="tbGrid" class="tb-grid" aria-label="Photo filmstrip"></section></main>

    <template id="tbCardTpl">
      <article class="tb-card">
        <div class="tb-thumb-wrap">
          <img class="tb-thumb" alt="" loading="lazy" />
          <span class="tb-badge"></span>
        </div>
        <div class="tb-meta">
          <p class="tb-variant"></p>
          <p class="tb-time"></p>
        </div>
        <button type="button" class="tb-btn tb-print">Print photo</button>
        <button type="button" class="tb-btn tb-retry" hidden>Retry AI portrait</button>
        <button type="button" class="tb-btn tb-ghost tb-download" disabled>Download photo</button>
        <button type="button" class="tb-btn tb-ghost tb-share" disabled>Share / Save to Photos</button>
        <p class="tb-job" hidden></p>
      </article>
    </template>

    <script src="/js/tablet.js?v=20261023-retry" type="module"></script>
  </body>
</html>
