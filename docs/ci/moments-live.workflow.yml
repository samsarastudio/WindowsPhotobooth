name: Moments Live validation
on:
  push:
    branches: [codex/moments-live-events]
    paths: ['moments-server/**', '.github/workflows/moments-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: moments-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: moments-server/package-lock.json
      - run: npm ci
      - run: npm run test:live
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x moments-server/mobile/android/gradlew
      - run: moments-server/mobile/android/gradlew -p moments-server/mobile/android assembleDebug bundleRelease lint --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: moments-live-android-unsigned
          path: |
            moments-server/mobile/android/app/build/outputs/apk/debug/*.apk
            moments-server/mobile/android/app/build/outputs/bundle/release/*.aab
  ios:
    runs-on: macos-latest
    env:
      MOMENTS_APPLE_TEAM_ID: UNSIGNED00
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate --spec moments-server/mobile/ios/project.yml
      - run: xcodebuild -project moments-server/mobile/ios/MomentsLive.xcodeproj -scheme MomentsLive -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/moments-build CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project moments-server/mobile/ios/MomentsLive.xcodeproj -scheme MomentsClip -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/moments-clip-build CODE_SIGNING_ALLOWED=NO build
