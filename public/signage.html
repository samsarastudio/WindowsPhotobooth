<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Moments Signage</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font:16px system-ui}video{display:block;width:100vw;height:100dvh;object-fit:contain;background:#000}#tools{position:fixed;z-index:2;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;background:#17171aed;border:1px solid #444;border-radius:12px;transition:opacity .3s}body.playing.idle #tools{opacity:0;pointer-events:none}select,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #666;background:#27272c;color:white;cursor:pointer}#status{flex:1;min-width:180px;font-size:14px;color:#ddd}#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3}#start[hidden]{display:none}a{color:#fff}
</style>
<video id="video" muted autoplay loop playsinline preload="auto" aria-label="Looping promotional signage"></video>
<div id="tools"><strong>Moments signage</strong><button id="fullscreen">Full screen</button><button id="reload">Check for update</button><span id="status" role="status">Loading signage…</span><a href="/admin">Admin</a></div>
<button id="start" hidden>Tap to play</button>
<script type="module" src="/js/signage.js"></script>
</html>
