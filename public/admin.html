<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moments admin</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/gallery.css" />
  </head>
  <body class="admin-body">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">inmoment</p>
        <h1>Gallery admin</h1>
      </div>
    </header>
    <main class="admin-main">
      <section class="card">
        <h2>Sign in</h2>
        <label>Admin PIN</label>
        <input id="pin" class="input" type="password" autocomplete="current-password" />
        <button type="button" class="btn primary" id="btnLogin">Unlock</button>
        <p id="loginErr" class="err" hidden></p>
      </section>

      <section class="card" id="panel" hidden>
        <h2>Default expiry</h2>
        <label>Default TTL (days) for new sessions</label>
        <div class="row">
          <input id="ttl" class="input" type="number" min="1" max="3650" />
          <button type="button" class="btn primary" id="btnSaveTtl">Save</button>
        </div>
        <button type="button" class="btn ghost" id="btnPurge">Purge expired now</button>
        <p id="adminStatus" class="meta"></p>

        <h2 class="mt">Mosaic wall</h2>
        <p class="meta">Public URLs: <code>/wall</code> · <code>/wall/slideshow</code> · <code>/{session}/wall</code></p>
        <label>Wall title</label>
        <input id="wallTitle" class="input" />
        <label>Center overlay text (optional)</label>
        <input id="wallOverlay" class="input" placeholder="e.g. UNLEASHED" />
        <label>Columns</label>
        <input id="wallColumns" class="input" type="number" min="6" max="24" />
        <label>Empty cell ratio (0–0.6)</label>
        <input id="wallEmpty" class="input" type="number" min="0" max="0.6" step="0.01" />
        <button type="button" class="btn primary" id="btnSaveWall">Save wall settings</button>

        <h2 class="mt">Photo frames (booth overlays)</h2>
        <p class="meta">Upload PNGs with transparent/black photo holes. Booths sync these from the server.</p>
        <input id="frameFile" type="file" accept="image/png,image/jpeg,image/webp" />
        <button type="button" class="btn primary" id="btnUploadFrame">Upload frame</button>
        <div id="frameList" class="frame-grid"></div>

        <h2 class="mt">Sessions</h2>
        <div id="sessionList" class="session-list"></div>
      </section>
    </main>
    <script src="/js/admin.js" type="module"></script>
  </body>
</html>
