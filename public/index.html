<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>inmoment gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/gallery.css?v=20260820-9" />
  </head>
  <body>
    <div class="leaf leaf-tr" aria-hidden="true"></div>
    <div class="leaf leaf-bl" aria-hidden="true"></div>

    <header class="top" id="topBar">
      <div class="brand">
        <p class="eyebrow">inmoment</p>
        <h1 id="sessionTitle">Gallery</h1>
        <p id="sessionMeta" class="meta"></p>
      </div>
      <div class="actions">
        <button type="button" class="btn ghost" id="btnGrid">Grid</button>
        <button type="button" class="btn ghost" id="btnWall">Mosaic wall</button>
        <button type="button" class="btn ghost" id="btnSlideshow">Slideshow</button>
      </div>
    </header>

    <main>
      <p id="status" class="status" hidden></p>
      <p id="empty" class="empty" hidden>Photos will appear here as they’re taken…</p>
      <div id="grid" class="grid" aria-live="polite"></div>
      <div id="guestPhoto" class="guest-photo" hidden>
        <div class="guest-photo-layout">
          <figure class="guest-photo-frame">
            <img id="guestPhotoImg" alt="Your photo" />
            <figcaption class="guest-photo-caption">
              <p class="guest-photo-label">Your photo</p>
              <div class="guest-photo-actions">
                <button type="button" class="btn primary" id="btnAttachCard" title="Link my event card">
                  Link my card
                </button>
              </div>
              <p id="attachStatus" class="guest-attach-status" hidden></p>
              <p id="attachLinked" class="guest-attach-linked" hidden>
                <a id="attachLinkedUrl" class="btn primary" href="#" target="_blank" rel="noopener">Open card page</a>
              </p>
            </figcaption>
          </figure>
        </div>
      </div>
      <div id="mosaic" class="mosaic" hidden aria-live="polite">
        <header class="mosaic-brand" aria-label="Branding">
          <div class="mosaic-brand-inmoment">
            <span class="mosaic-brand-eyebrow">inmoment</span>
          </div>
          <div class="mosaic-brand-partner" id="mosaicPartner" hidden>
            <img id="mosaicPartnerLogo" class="mosaic-brand-logo" alt="" hidden />
            <span id="mosaicPartnerText" class="mosaic-brand-text" hidden></span>
          </div>
        </header>
        <div id="mosaicStage" class="mosaic-stage">
          <div id="mosaicBackdrop" class="mosaic-backdrop" hidden aria-hidden="true">
            <img id="mosaicBackdropImg" class="mosaic-backdrop-img" alt="" />
          </div>
          <div id="mosaicBrandReveal" class="mosaic-brand-reveal" hidden aria-hidden="true">
            <div class="mosaic-brand-reveal-inner">
              <img id="mosaicBrandRevealLogo" class="mosaic-brand-reveal-logo" alt="" hidden />
              <p id="mosaicBrandRevealText" class="mosaic-brand-reveal-text" hidden></p>
            </div>
          </div>
        </div>
        <p id="wallOverlay" class="mosaic-watermark" hidden></p>
      </div>
    </main>

    <div id="lightbox" class="lightbox" hidden>
      <button type="button" class="lb-close" id="lbClose" aria-label="Close">×</button>
      <button type="button" class="lb-nav prev" id="lbPrev" aria-label="Previous">‹</button>
      <figure>
        <img id="lbImg" alt="" />
        <figcaption>
          <span id="lbVariant"></span>
          <button type="button" class="btn primary" id="lbDownload">Save photo</button>
        </figcaption>
      </figure>
      <button type="button" class="lb-nav next" id="lbNext" aria-label="Next">›</button>
    </div>

    <div id="attachPanel" class="attach-overlay" hidden>
      <div class="attach-dialog" role="dialog" aria-modal="true" aria-labelledby="attachTitle">
        <p class="guest-photo-label" id="attachTitle">Scan your event card</p>
        <p class="guest-attach-help">Point at the printed QR on your card.</p>
        <div id="attachCameraWrap" class="attach-camera-wrap">
          <video id="attachVideo" playsinline muted></video>
          <p class="attach-camera-hint">Looking for QR…</p>
        </div>
        <button type="button" class="btn ghost" id="btnAttachCancel">Cancel</button>
      </div>
    </div>

    <div id="slideshow" class="slideshow" hidden>
      <img id="ssImg" alt="" />
      <div class="ss-bar">
        <button type="button" class="btn ghost" id="ssPrev">Prev</button>
        <button type="button" class="btn primary" id="ssToggle">Pause</button>
        <button type="button" class="btn ghost" id="ssNext">Next</button>
        <button type="button" class="btn ghost" id="ssExit">Exit</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="/js/gallery.js?v=20260820-9" type="module"></script>
  </body>
</html>
